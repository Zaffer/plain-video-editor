[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plain-video-editor"
version = "0.0.1"
description = "A minimal video editor: trim, crop, join, lossless when possible."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
pve = "pve.cli:main"

[tool.setuptools]
packages = ["pve"]
